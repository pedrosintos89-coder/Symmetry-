<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry: Générateur de Façade</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #e74c3c;
            margin-bottom: 20px;
        }
        .upload-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 2px dashed #aed6f1;
            border-radius: 10px;
            background-color: #ecf0f1;
        }
        input[type="file"] {
            display: block;
            margin: 0 auto 15px;
        }
        .controls-section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="range"] {
            width: 80%;
        }
        .action-btn {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .action-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .results-section {
            margin-top: 30px;
            padding-top: 20px;
        }
        #symmetryCanvas {
            max-width: 100%;
            height: auto;
            border: 1px solid #333;
            margin-top: 15px;
            display: none;
        }
        .status-message {
            margin-top: 15px;
            font-size: 1em;
            color: #e74c3c;
        }
        .status-message.success {
            color: #2ecc71;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ Symmetry: Créateur de Façade</h1>
        <p>Téléchargez une image. L'application va refléter la moitié droite pour créer une façade double symétrique.</p>

        <div class="upload-section">
            <label for="imageUpload">
                Télécharger une image :
            </label>
            <input type="file" id="imageUpload" accept="image/*">
            <p id="uploadStatus" class="status-message">Veuillez sélectionner une image.</p>
        </div>

        <div class="controls-section">
            <h2>Réglage de la Perspective (Tassement)</h2>
            <div class="control-group">
                <label for="skewAngle">Inclinaison Horizontale (SkewX): <span id="skewValue">0.000</span></label>
                <input type="range" id="skewAngle" min="-0.5" max="0.5" step="0.001" value="0" disabled>
            </div>
            
            <button id="applySymmetryButton" class="action-btn" disabled>
                Appliquer la Symétrie
            </button>
        </div>

        <div class="results-section">
            <h2>Résultat</h2>
            <canvas id="symmetryCanvas"></canvas>
            <p id="noImageText">L'image symétrique apparaîtra ici.</p>
            <button id="downloadButton" class="action-btn" style="background-color: #2ecc71; margin-top: 15px;" disabled>
                Télécharger l'Image
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
